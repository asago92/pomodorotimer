<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pomodoro Timer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Mono:wght@700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F0EDE8;
    --text: #2A2A2A;
    --text-muted: #8A8580;
    --accent: #2A2A2A;
    --pill-bg: #E4E0DA;
    --pill-active-bg: #2A2A2A;
    --pill-active-text: #F0EDE8;
    --btn-bg: #E4E0DA;
    --btn-hover: #D6D2CC;
    --shadow: rgba(0,0,0,0.06);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    overflow: hidden;
  }

  .container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
    animation: fadeIn 0.6s ease-out;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Mode Tabs */
  .tabs {
    display: flex;
    gap: 6px;
    background: var(--pill-bg);
    padding: 5px;
    border-radius: 100px;
  }

  .tab {
    padding: 8px 20px;
    border-radius: 100px;
    border: none;
    background: transparent;
    color: var(--text-muted);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    letter-spacing: 0.01em;
  }

  .tab:hover {
    color: var(--text);
  }

  .tab.active {
    background: var(--pill-active-bg);
    color: var(--pill-active-text);
    box-shadow: 0 2px 8px var(--shadow);
  }

  /* Timer Display */
  .timer-display {
    font-family: 'Space Mono', monospace;
    font-size: clamp(96px, 18vw, 180px);
    font-weight: 700;
    line-height: 1;
    letter-spacing: -0.04em;
    color: var(--text);
    transition: opacity 0.3s ease;
    position: relative;
  }

  .timer-display.pulse {
    animation: pulse 0.6s ease;
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  /* Controls */
  .controls {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .btn-start {
    padding: 12px 36px;
    border-radius: 100px;
    background: var(--accent);
    color: var(--pill-active-text);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: 0.03em;
  }

  .btn-start:hover {
    transform: scale(1.04);
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }

  .btn-start:active {
    transform: scale(0.98);
  }

  .btn-start.running {
    background: #C44D3F;
  }

  .btn-icon {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--btn-bg);
    color: var(--text-muted);
  }

  .btn-icon:hover {
    background: var(--btn-hover);
    color: var(--text);
    transform: scale(1.08);
  }

  .btn-icon:active {
    transform: scale(0.95);
  }

  .btn-icon svg {
    width: 18px;
    height: 18px;
  }

  /* Settings Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.25);
    backdrop-filter: blur(6px);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--bg);
    border-radius: 20px;
    padding: 36px;
    width: 340px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.15);
    transform: scale(0.92);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .modal-overlay.open .modal {
    transform: scale(1);
  }

  .modal h2 {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 28px;
    letter-spacing: -0.01em;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 20px;
  }

  .setting-label {
    font-size: 14px;
    color: var(--text-muted);
    font-weight: 500;
  }

  .setting-input {
    width: 72px;
    padding: 8px 12px;
    border-radius: 10px;
    border: 2px solid var(--pill-bg);
    background: transparent;
    font-family: 'Space Mono', monospace;
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    text-align: center;
    outline: none;
    transition: border-color 0.2s ease;
  }

  .setting-input:focus {
    border-color: var(--accent);
  }

  .btn-save {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    background: var(--accent);
    color: var(--pill-active-text);
    font-size: 14px;
    font-weight: 600;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }

  .btn-save:hover {
    opacity: 0.9;
  }

  /* Session counter */
  .sessions {
    font-size: 13px;
    color: var(--text-muted);
    font-weight: 500;
    letter-spacing: 0.04em;
  }

  .sessions span {
    color: var(--text);
    font-weight: 600;
  }
</style>
</head>
<body>

<div class="container">
  <div class="tabs">
    <button class="tab active" data-mode="focus">Focus</button>
    <button class="tab" data-mode="short">Short Break</button>
    <button class="tab" data-mode="long">Long Break</button>
  </div>

  <div class="timer-display" id="timer">25:00</div>

  <div class="controls">
    <button class="btn btn-start" id="startBtn">Start</button>
    <button class="btn btn-icon" id="resetBtn" title="Reset">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
    </button>
    <button class="btn btn-icon" id="settingsBtn" title="Settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
    </button>
  </div>

  <div class="sessions">Session <span id="sessionCount">1</span> of <span id="sessionTotal">4</span></div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <h2>Settings</h2>
    <div class="setting-row">
      <span class="setting-label">Focus (min)</span>
      <input class="setting-input" type="number" id="setFocus" value="25" min="1" max="120">
    </div>
    <div class="setting-row">
      <span class="setting-label">Short Break (min)</span>
      <input class="setting-input" type="number" id="setShort" value="5" min="1" max="30">
    </div>
    <div class="setting-row">
      <span class="setting-label">Long Break (min)</span>
      <input class="setting-input" type="number" id="setLong" value="15" min="1" max="60">
    </div>
    <div class="setting-row">
      <span class="setting-label">Sessions</span>
      <input class="setting-input" type="number" id="setSessions" value="4" min="1" max="12">
    </div>
    <button class="btn btn-save" id="saveBtn">Save</button>
  </div>
</div>

<script>
  const timerEl = document.getElementById('timer');
  const startBtn = document.getElementById('startBtn');
  const resetBtn = document.getElementById('resetBtn');
  const settingsBtn = document.getElementById('settingsBtn');
  const modal = document.getElementById('modal');
  const saveBtn = document.getElementById('saveBtn');
  const sessionCountEl = document.getElementById('sessionCount');
  const sessionTotalEl = document.getElementById('sessionTotal');
  const tabs = document.querySelectorAll('.tab');

  let durations = { focus: 25, short: 5, long: 15 };
  let totalSessions = 4;
  let currentMode = 'focus';
  let currentSession = 1;
  let timeLeft = durations.focus * 60;
  let interval = null;
  let running = false;

  function formatTime(s) {
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = (s % 60).toString().padStart(2, '0');
    return `${m}:${sec}`;
  }

  function updateDisplay() {
    timerEl.textContent = formatTime(timeLeft);
    document.title = `${formatTime(timeLeft)} — ${currentMode === 'focus' ? 'Focus' : currentMode === 'short' ? 'Break' : 'Long Break'}`;
  }

  function setMode(mode) {
    currentMode = mode;
    timeLeft = durations[mode] * 60;
    stopTimer();
    updateDisplay();
    tabs.forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
    timerEl.classList.add('pulse');
    setTimeout(() => timerEl.classList.remove('pulse'), 600);
  }

  function startTimer() {
    if (running) return;
    running = true;
    startBtn.textContent = 'Pause';
    startBtn.classList.add('running');
    interval = setInterval(() => {
      timeLeft--;
      updateDisplay();
      if (timeLeft <= 0) {
        clearInterval(interval);
        running = false;
        playSound();
        autoAdvance();
      }
    }, 1000);
  }

  function pauseTimer() {
    running = false;
    clearInterval(interval);
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
  }

  function stopTimer() {
    pauseTimer();
    startBtn.textContent = 'Start';
    startBtn.classList.remove('running');
  }

  function autoAdvance() {
    if (currentMode === 'focus') {
      if (currentSession >= totalSessions) {
        setMode('long');
        currentSession = 1;
      } else {
        currentSession++;
        setMode('short');
      }
    } else {
      setMode('focus');
    }
    sessionCountEl.textContent = currentSession;
  }

  function playSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach(delay => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 680;
        gain.gain.setValueAtTime(0.3, ctx.currentTime + delay);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + 0.15);
        osc.start(ctx.currentTime + delay);
        osc.stop(ctx.currentTime + delay + 0.15);
      });
    } catch(e) {}
  }

  // Events
  startBtn.addEventListener('click', () => running ? pauseTimer() : startTimer());

  resetBtn.addEventListener('click', () => {
    setMode(currentMode);
  });

  tabs.forEach(tab => {
    tab.addEventListener('click', () => setMode(tab.dataset.mode));
  });

  settingsBtn.addEventListener('click', () => {
    document.getElementById('setFocus').value = durations.focus;
    document.getElementById('setShort').value = durations.short;
    document.getElementById('setLong').value = durations.long;
    document.getElementById('setSessions').value = totalSessions;
    modal.classList.add('open');
  });

  modal.addEventListener('click', (e) => {
    if (e.target === modal) modal.classList.remove('open');
  });

  saveBtn.addEventListener('click', () => {
    durations.focus = Math.max(1, parseInt(document.getElementById('setFocus').value) || 25);
    durations.short = Math.max(1, parseInt(document.getElementById('setShort').value) || 5);
    durations.long = Math.max(1, parseInt(document.getElementById('setLong').value) || 15);
    totalSessions = Math.max(1, parseInt(document.getElementById('setSessions').value) || 4);
    sessionTotalEl.textContent = totalSessions;
    modal.classList.remove('open');
    setMode(currentMode);
  });

  updateDisplay();
</script>
</body>
</html>
